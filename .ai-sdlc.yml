# Written by orb-importer for Orbulus code-only maintenance.
# Describes this repository as found at the revision below. Review before merging.
version: 1
repo:
  name: "Praise"
  owner: "kcsnap"
  description: "Praise is a workplace peer-recognition application. Signed-in users send a colleague, identified by email address, one of a fixed set of praise types, see the praises they have sent and received, and take part in gamification: badges, achievements, streaks and token prizes for giving praise and signing in. A separate gamification service (Gamey.Api) holds games, gamers, game events, badges, achievements, prizes, streaks and token wallets. Stack: a .NET solution (Praise.sln) with ASP.NET Core controller APIs (Praise.Api, Gamey.Api), a Blazor web front end (Praise.WebApp), an admin app shell (Praise.AdminApp), a .NET MAUI client (Praise.App), shared model libraries (Praise.Models, Gamey.Models) and MSTest test projects. Data is stored in Azure Cosmos DB. A Next.js starter project (praise-vercel-nextjs) is also present."
stack:
  frontend:
    framework: "Blazor Web App, interactive server components (ASP.NET Core Razor Components) with Blazor Bootstrap"
    language: "C#"
    location: "Praise.WebApp"
  api:
    framework: "ASP.NET Core Web API with MVC controllers (Gamey.Api and Praise.Api)"
    language: "C#"
    location: "Gamey.Api"
    endpoints:
      - "PATCH /achievements/{achievementId}"
      - "GET /badges"
      - "GET /game"
      - "GET /gameevent"
      - "POST /gameevent"
      - "POST /gamers"
      - "GET /gamers/{gamerEmail}"
      - "GET /gamers/{gamerId}/achievements"
      - "PATCH /gamers/{gamerId}/achievements/{achievementId}"
      - "GET /gamers/{gamerId}/prizes"
      - "GET /gamers/{gamerId}/streaks"
      - "GET /praise"
      - "GET /weatherforecast[controller]"
  database:
    engine: "Azure Cosmos DB (NoSQL API)"
    orm: "None; Microsoft.Azure.Cosmos SDK containers with parameterised SQL queries"
    tables:
      - "Achievements"
      - "ActionHistory"
      - "BadgeGroups"
      - "Badges"
      - "GameEvents"
      - "GamerEventData"
      - "Gamers"
      - "PraiseContainer"
      - "PrizeGroups"
      - "Wallet"
      - "game"
