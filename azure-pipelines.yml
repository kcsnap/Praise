# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  vmImage: windows-latest

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2 #This is needed until windows-latest hosted agent will support .net 9
  displayName: 'Install .Net9 (currently not included in latest)'
  inputs:
    packageType: 'sdk'
    version: '9.0.100'
    performMultiLevelLookup: true
    installationPath: '$(Agent.ToolsDirectory)/dotnet'

# - task: DotNetCoreCLI@2
#   displayName: 'dotnet build Praise.WebApp $(buildConfiguration)'
#   inputs:
#     command: 'build'
#     projects: '*/Praise.WebApp.csproj'
#     arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish Praise.WebApp $(buildConfiguration)'
  inputs:
    command: 'publish'
    projects: '*/Praise.WebApp.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publishwebapp'
    zipAfterPublish: true
    publishWebProjects: false

