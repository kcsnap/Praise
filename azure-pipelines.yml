- task: AzureWebApp@1
  displayName: 'Deploy to Azure WebApp'
  inputs:
    azureSubscription: 'Pay-As-You-Go(66673944-b353-4256-b71c-0cd8751c81c0)'
    appType: 'webApp'
    appName: 'Praise-WebApp-Test'
    package: '$(Build.ArtifactStagingDirectory)/publishwebapp/Praise.WebApp.zip'
    

