##############################################################
# Publish Gamey
- task: DotNetCoreCLI@2
  displayName: 'dotnet publish Gamey.Api $(buildConfiguration)'
  inputs:
    command: 'publish'
    projects: '*/Gamey.Api.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publishgamey'
    zipAfterPublish: true
    publishWebProjects: false

- task: AzureWebApp@1
  displayName: 'Deploy to Azure Gamey'
  inputs:
    azureSubscription: 'Pay-As-You-Go(66673944-b353-4256-b71c-0cd8751c81c0)'
    appType: 'webApp'
    appName: 'Gamey-WebApp-Test'
    package: '$(Build.ArtifactStagingDirectory)/publishgamey/Gamey.Api.zip'
    
