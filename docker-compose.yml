services:
  praise.webapp:
    image: ${DOCKER_REGISTRY-}praisewebapp
    depends_on:
      praise.api:
        condition: service_healthy
    build:
      context: .
      dockerfile: Praise.WebApp/Dockerfile

  praise.api:
    image: ${DOCKER_REGISTRY-}praiseapi
    build:
      context: .
      dockerfile: Praise.Api/Dockerfile

